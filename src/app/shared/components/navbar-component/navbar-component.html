<nav class="border-b border-slate-200 bg-white transition-colors duration-200 dark:border-slate-800 dark:bg-slate-950">

    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6">

        <!-- Logo -->
        <a routerLink="/" (click)="closeMenu()" class="flex items-center gap-2.5">
            <div
                class="flex h-9 w-9 items-center justify-center rounded-full bg-indigo-600 text-white shadow-sm dark:bg-indigo-500">
                <img src="/icons/icon-72x72.png" alt="TeleStore Logo" />
            </div>

            <span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">
                TeleStore
            </span>
        </a>

        <!-- Desktop Navigation -->
        @if (isAuthenticated$ | async) {

        <div class="hidden items-center gap-2 md:flex">

            <!-- My Drive -->
            <a routerLink="/drive/my-drive"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400"
                [routerLinkActiveOptions]="{ exact: false }"
                class="flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">

                <ng-icon name="heroHome" size="16"></ng-icon>
                My Drive
            </a>

            <!-- Divider -->
            <div class="mx-2 h-6 w-px bg-slate-200 dark:bg-slate-800"></div>

            <!-- Theme Toggle -->
            <button type="button" (click)="themeService.toggleTheme()"
                [attr.aria-label]="themeService.darkModeSignal() ? 'Switch to light mode' : 'Switch to dark mode'"
                class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">

                @if (themeService.darkModeSignal()) {
                <ng-icon name="heroSun" size="18"></ng-icon>
                } @else {
                <ng-icon name="heroMoon" size="18"></ng-icon>
                }
            </button>

            <!-- Profile -->
            <a routerLink="/profile"
                routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400"
                class="flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">

                @if (profileInitial()) {
                <span
                    class="flex h-6 w-6 items-center justify-center rounded-full bg-indigo-100 text-[10px] font-bold text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-400">
                    {{ profileInitial() }}
                </span>
                } @else {
                <ng-icon name="heroUserCircle" size="17"></ng-icon>
                }

                Profile
            </a>

            <!-- Logout -->
            <button type="button" (click)="logout()" [disabled]="isLoggingOut()"
                class="ml-1 flex cursor-pointer items-center gap-1.5 rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-red-700 hover:shadow disabled:cursor-not-allowed disabled:opacity-60 dark:bg-red-500 dark:hover:bg-red-600">

                @if (isLoggingOut()) {
                <ng-icon name="heroArrowPath" size="15" class="animate-spin"></ng-icon>
                Logging out…
                } @else {
                <ng-icon name="heroArrowRightOnRectangle" size="15"></ng-icon>
                Logout
                }
            </button>
        </div>

        } @else {

        <!-- Public Desktop Navigation -->
        <div class="hidden items-center gap-2 md:flex">

            <!-- Theme Toggle -->
            <button type="button" (click)="themeService.toggleTheme()"
                [attr.aria-label]="themeService.darkModeSignal() ? 'Switch to light mode' : 'Switch to dark mode'"
                class="flex h-9 w-9 cursor-pointer items-center justify-center rounded-lg text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">

                @if (themeService.darkModeSignal()) {
                <ng-icon name="heroSun" size="18"></ng-icon>
                } @else {
                <ng-icon name="heroMoon" size="18"></ng-icon>
                }
            </button>

            <!-- Login -->
            <a routerLink="/login"
                class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">
                Login
            </a>

            <!-- Get Started -->
            <a routerLink="/register"
                class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 hover:shadow dark:bg-indigo-500 dark:hover:bg-indigo-600">
                Get started
            </a>
        </div>
        }

        <!-- Mobile Menu Button -->
        <button type="button" (click)="toggleMenu()"
            class="flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 md:hidden dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
            [attr.aria-expanded]="menuOpen()" aria-controls="mobile-nav-panel" aria-label="Toggle navigation menu">

            @if (menuOpen()) {
            <ng-icon name="heroXMark" size="24"></ng-icon>
            } @else {
            <ng-icon name="heroBars3" size="24"></ng-icon>
            }
        </button>

    </div>

    <!-- Mobile Navigation -->
    <div id="mobile-nav-panel"
        class="overflow-hidden border-t border-slate-200 bg-white transition-all duration-200 ease-in-out md:hidden dark:border-slate-800 dark:bg-slate-950"
        [class.max-h-0]="!menuOpen()" [class.border-t-0]="!menuOpen()" [class.max-h-96]="menuOpen()">

        <div class="px-4 py-4">

            @if (isAuthenticated$ | async) {

            <div class="flex flex-col gap-1">

                <!-- My Drive -->
                <a routerLink="/drive/my-drive"
                    routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400"
                    (click)="closeMenu()"
                    class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">

                    <ng-icon name="heroHome" size="18"></ng-icon>
                    My Drive
                </a>

                <!-- Profile -->
                <a routerLink="/profile"
                    routerLinkActive="bg-indigo-50 text-indigo-600 dark:bg-indigo-500/10 dark:text-indigo-400"
                    (click)="closeMenu()"
                    class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">

                    @if (profileInitial()) {
                    <span
                        class="flex h-6 w-6 items-center justify-center rounded-full bg-indigo-100 text-[10px] font-bold text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-400">
                        {{ profileInitial() }}
                    </span>
                    } @else {
                    <ng-icon name="heroUserCircle" size="18"></ng-icon>
                    }

                    Profile
                </a>

                <!-- Theme -->
                <button type="button" (click)="themeService.toggleTheme()"
                    class="flex w-full cursor-pointer items-center justify-between rounded-lg px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">

                    <div class="flex items-center gap-3">
                        @if (themeService.darkModeSignal()) {
                        <ng-icon name="heroSun" size="18"></ng-icon>
                        <span>Light mode</span>
                        } @else {
                        <ng-icon name="heroMoon" size="18"></ng-icon>
                        <span>Dark mode</span>
                        }
                    </div>

                    <!-- Toggle Indicator -->
                    <div class="relative h-6 w-11 rounded-full bg-slate-200 transition dark:bg-indigo-600">

                        <div class="absolute top-1 h-4 w-4 rounded-full bg-white shadow-sm transition-all duration-200"
                            [class.left-1]="!themeService.darkModeSignal()"
                            [class.left-6]="themeService.darkModeSignal()">
                        </div>
                    </div>
                </button>

                <!-- Divider -->
                <div class="my-2 h-px bg-slate-200 dark:bg-slate-800"></div>

                <!-- Logout -->
                <button type="button" (click)="logout()" [disabled]="isLoggingOut()"
                    class="flex w-full cursor-pointer items-center justify-center gap-2 rounded-lg bg-red-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-red-700 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-red-500 dark:hover:bg-red-600">

                    @if (isLoggingOut()) {
                    <ng-icon name="heroArrowPath" size="16" class="animate-spin"></ng-icon>
                    Logging out…
                    } @else {
                    <ng-icon name="heroArrowRightOnRectangle" size="16"></ng-icon>
                    Logout
                    }
                </button>

            </div>

            } @else {

            <!-- Public Mobile Navigation -->
            <div class="flex flex-col gap-1">

                <!-- Theme -->
                <button type="button" (click)="themeService.toggleTheme()"
                    class="flex w-full cursor-pointer items-center justify-between rounded-lg px-4 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">

                    <div class="flex items-center gap-3">
                        @if (themeService.darkModeSignal()) {
                        <ng-icon name="heroSun" size="18"></ng-icon>
                        <span>Light mode</span>
                        } @else {
                        <ng-icon name="heroMoon" size="18"></ng-icon>
                        <span>Dark mode</span>
                        }
                    </div>

                    <div class="relative h-6 w-11 rounded-full bg-slate-200 dark:bg-indigo-600">
                        <div class="absolute top-1 h-4 w-4 rounded-full bg-white shadow-sm transition-all duration-200"
                            [class.left-1]="!themeService.darkModeSignal()"
                            [class.left-6]="themeService.darkModeSignal()">
                        </div>
                    </div>
                </button>

                <!-- Divider -->
                <div class="my-2 h-px bg-slate-200 dark:bg-slate-800"></div>

                <!-- Login -->
                <a routerLink="/login" (click)="closeMenu()"
                    class="rounded-lg px-4 py-3 text-center text-sm font-semibold text-slate-700 transition hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                    Login
                </a>

                <!-- Get Started -->
                <a routerLink="/register" (click)="closeMenu()"
                    class="rounded-lg bg-indigo-600 px-4 py-3 text-center text-sm font-semibold text-white transition hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-600">
                    Get started
                </a>

            </div>
            }

        </div>
    </div>

</nav>
