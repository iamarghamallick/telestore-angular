<nav class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 sm:px-6">

        <!-- Logo -->
        <a routerLink="/" (click)="closeMenu()" class="flex items-center gap-2.5">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm">
                <ng-icon name="heroCloudArrowUp" size="20"></ng-icon>
            </div>
            <span class="text-xl font-bold tracking-tight text-slate-900">TeleStore</span>
        </a>

        <!-- Desktop Navigation -->
        @if (isAuthenticated$ | async) {

        <div class="hidden items-center gap-2 md:flex">

            <a routerLink="/drive/my-drive" routerLinkActive="bg-indigo-50 text-indigo-600"
                [routerLinkActiveOptions]="{ exact: false }" class="flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-slate-600
            transition hover:bg-slate-100 hover:text-slate-900">
                <ng-icon name="heroHome" size="16"></ng-icon>
                My Drive
            </a>

            <div class="ml-2 flex items-center gap-2 border-l border-slate-200 pl-4">

                <a routerLink="/profile" routerLinkActive="bg-indigo-50 text-indigo-600" class="flex items-center gap-1.5 rounded-lg px-3 py-2 text-sm font-medium text-slate-600
                transition hover:bg-slate-100 hover:text-slate-900">
                    @if (profileInitial()) {
                    <span
                        class="flex h-5 w-5 items-center justify-center rounded-full bg-indigo-100 text-[10px] font-bold text-indigo-700">
                        {{ profileInitial() }}
                    </span>
                    } @else {
                    <ng-icon name="heroUserCircle" size="16"></ng-icon>
                    }
                    Profile
                </a>

                <button type="button" (click)="logout()" [disabled]="isLoggingOut()" class="flex items-center gap-1.5 rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white
                 transition hover:bg-red-700 cursor-pointer disabled:cursor-not-allowed disabled:opacity-60">
                    @if (isLoggingOut()) {
                    <ng-icon name="heroArrowPath" size="15" class="animate-spin"></ng-icon>
                    } @else {
                    <ng-icon name="heroArrowRightOnRectangle" size="15"></ng-icon>
                    }
                    Logout
                </button>
            </div>
        </div>

        } @else {

        <!-- Public Navigation -->
        <div class="hidden items-center gap-3 md:flex">
            <a routerLink="/login" class="rounded-lg px-4 py-2 text-sm font-semibold text-slate-600 transition hover:bg-slate-100
            hover:text-slate-900">
                Login
            </a>
            <a routerLink="/register" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm transition
            hover:bg-indigo-700 hover:shadow">
                Get started
            </a>
        </div>

        }

        <!-- Mobile Menu Button -->
        <button type="button" (click)="toggleMenu()"
            class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100 hover:text-slate-900 md:hidden"
            [attr.aria-expanded]="menuOpen()" aria-controls="mobile-nav-panel" aria-label="Toggle navigation menu">
            @if (menuOpen()) {
            <ng-icon name="heroXMark" size="24"></ng-icon>
            } @else {
            <ng-icon name="heroBars3" size="24"></ng-icon>
            }
        </button>
    </div>

    <!-- Mobile Navigation -->
    <div id="mobile-nav-panel"
        class="overflow-hidden border-t border-slate-200 bg-white transition-all duration-200 ease-in-out md:hidden"
        [class.max-h-0]="!menuOpen()" [class.border-t-0]="!menuOpen()" [class.max-h-96]="menuOpen()">
        <div class="px-4 py-4">
            @if (isAuthenticated$ | async) {

            <div class="flex flex-col gap-1">
                <a routerLink="/drive/my-drive" routerLinkActive="bg-indigo-50 text-indigo-600" (click)="closeMenu()"
                    class="flex items-center gap-2 rounded-lg px-4 py-3 text-sm font-medium text-slate-700 transition
                hover:bg-slate-100">
                    <ng-icon name="heroHome" size="17"></ng-icon>
                    My Drive
                </a>

                <a routerLink="/profile" routerLinkActive="bg-indigo-50 text-indigo-600" (click)="closeMenu()" class="flex items-center gap-2 rounded-lg px-4 py-3 text-sm font-medium text-slate-700 transition
                hover:bg-slate-100">
                    @if (profileInitial()) {
                    <span
                        class="flex h-5 w-5 items-center justify-center rounded-full bg-indigo-100 text-[10px] font-bold text-indigo-700">
                        {{ profileInitial() }}
                    </span>
                    } @else {
                    <ng-icon name="heroUserCircle" size="17"></ng-icon>
                    }
                    Profile
                </a>

                <button type="button" (click)="logout()" [disabled]="isLoggingOut()"
                    class="mt-1 flex items-center justify-center gap-2 rounded-lg bg-red-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-red-700 cursor-pointer disabled:cursor-not-allowed disabled:opacity-60">
                    @if (isLoggingOut()) {
                    <ng-icon name="heroArrowPath" size="16" class="animate-spin"></ng-icon>
                    Logging out…
                    } @else {
                    <ng-icon name="heroArrowRightOnRectangle" size="16"></ng-icon>
                    Logout
                    }
                </button>
            </div>

            } @else {

            <div class="flex flex-col gap-2">
                <a routerLink="/login" (click)="closeMenu()" class="rounded-lg px-4 py-3 text-center text-sm font-semibold text-slate-700 transition
                hover:bg-slate-100">
                    Login
                </a>
                <a routerLink="/register" (click)="closeMenu()" class="rounded-lg bg-indigo-600 px-4 py-3 text-center text-sm font-semibold text-white transition
                hover:bg-indigo-700">
                    Get started
                </a>
            </div>

            }
        </div>
    </div>
</nav>
