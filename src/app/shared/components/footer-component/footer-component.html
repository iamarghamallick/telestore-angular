<footer class="border-t border-slate-200 bg-white">
    <div class="mx-auto max-w-7xl px-6 py-10 lg:px-8">

        <div class="flex flex-col gap-8 sm:flex-row sm:items-start sm:justify-between">

            <!-- Brand -->
            <div class="flex flex-col gap-3">
                <div class="flex items-center gap-2">
                    <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600 text-white">
                        <ng-icon name="heroCloudArrowUp" size="17"></ng-icon>
                    </div>
                    <span class="font-semibold text-slate-900">TeleStore</span>
                </div>

                <p class="max-w-xs text-sm leading-6 text-slate-500">
                    Simple storage for everything you create.
                </p>
            </div>

            <!-- Developer credit -->
            <div class="flex flex-col gap-3 sm:items-end">
                <p class="flex items-center gap-1.5 text-sm text-slate-500">
                    Built with
                    <ng-icon name="heroHeart" size="14" class="text-rose-500"></ng-icon>
                    by
                    <span class="font-semibold text-slate-800">{{ developerName }}</span>
                </p>

                <div class="flex items-center gap-2">
                    <a [href]="githubUrl" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile" class="flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 text-slate-500
                   transition hover:border-slate-300 hover:bg-slate-50 hover:text-slate-900">
                        <ng-icon name="phosphorGithubLogoBold" size="16"></ng-icon>
                    </a>

                    <a [href]="linkedinUrl" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile"
                        class="flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 text-slate-500
                   transition hover:border-slate-300 hover:bg-[#0A66C2]/5 hover:text-[#0A66C2]">
                        <ng-icon name="phosphorLinkedinLogoBold" size="16"></ng-icon>
                    </a>
                </div>
            </div>
        </div>

        <!-- Divider -->
        <div class="my-8 border-t border-slate-100"></div>

        <!-- Bottom bar -->
        <div class="flex flex-col-reverse items-center gap-3 sm:flex-row sm:justify-between">
            <p class="text-xs text-slate-400">
                © {{ currentYear }} TeleStore. All rights reserved.
            </p>

            <p class="text-xs text-slate-400">
                Made for people who like their files organized.
            </p>
        </div>
    </div>
</footer>
