<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
    <div class="w-full max-w-md rounded-xl bg-white p-8 shadow-lg">

        <h1 class="mb-2 text-center text-2xl font-bold text-gray-800">
            Login
        </h1>

        <p class="mb-6 text-center text-sm text-gray-500">
            Sign in to your account
        </p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">

            <!-- Email -->
            <div>
                <label for="email" class="mb-1 block text-sm font-medium text-gray-700">
                    Email
                </label>

                <input id="email" type="email" formControlName="email" placeholder="you@example.com" class="w-full rounded-lg border px-4 py-2.5
                 outline-none transition
                 focus:border-blue-500 focus:ring-2 focus:ring-blue-200" />

                @if (loginForm.controls.email.touched &&
                loginForm.controls.email.invalid) {
                <p class="mt-1 text-sm text-red-500">
                    Please enter a valid email.
                </p>
                }
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="mb-1 block text-sm font-medium text-gray-700">
                    Password
                </label>

                <input id="password" type="password" formControlName="password" placeholder="••••••••" class="w-full rounded-lg border border-gray-300 px-4 py-2.5
                 outline-none transition focus:ring-2 focus:ring-blue-200" />

                @if (loginForm.controls.password.touched &&
                loginForm.controls.password.invalid) {
                <p class="mt-1 text-sm text-red-500">
                    Password is required.
                </p>
                }
            </div>

            <!-- Submit -->
            <button type="submit" [disabled]="loginForm.invalid" class="w-full rounded-lg bg-blue-600 px-4 py-2.5
               font-medium text-white transition
               hover:bg-blue-700
               disabled:cursor-not-allowed
               disabled:opacity-50">
                Login
            </button>

        </form>
    </div>
</div>
