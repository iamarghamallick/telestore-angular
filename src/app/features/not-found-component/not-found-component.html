<div class="min-h-[calc(100vh-4rem)] bg-slate-50 px-6 py-16 transition-colors duration-200 dark:bg-slate-950">

    <div class="mx-auto flex min-h-[70vh] max-w-3xl items-center justify-center">

        <div class="w-full text-center">

            <!-- Icon -->
            <div
                class="mx-auto mb-8 flex h-20 w-20 items-center justify-center rounded-full bg-blue-100 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400">

                <img src="/icons/icon-72x72.png" alt="TeleStore Logo" />

            </div>


            <!-- 404 -->
            <p class="text-8xl font-black tracking-tight text-slate-900 dark:text-white sm:text-9xl">
                404
            </p>


            <!-- Heading -->
            <h1 class="mt-6 text-3xl font-bold tracking-tight text-slate-900 dark:text-white sm:text-4xl">
                Page not found
            </h1>


            <!-- Description -->
            <p class="mx-auto mt-4 max-w-md text-base leading-7 text-slate-500 dark:text-slate-400">
                Sorry, we couldn't find the page you're looking for.
                It may have been moved, deleted, or the URL might be incorrect.
            </p>


            <!-- Actions -->
            <div class="mt-8 flex flex-col items-center justify-center gap-3 sm:flex-row">

                <a routerLink="/"
                    class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 sm:w-auto">

                    <ng-icon name="heroHome" size="18">
                    </ng-icon>

                    Back to Home

                </a>


                @if (isAuthenticated$ | async) {

                <a routerLink="/drive/my-drive"
                    class="inline-flex w-full items-center justify-center gap-2 rounded-lg border border-slate-200 bg-white px-5 py-3 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800 sm:w-auto">

                    <ng-icon name="heroFolder" size="18">
                    </ng-icon>

                    Go to My Drive

                </a>

                }

            </div>

        </div>

    </div>

</div>
