<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>TeleStore</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TeleStore — A simpler home for everything you create.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      /* slate-50 */
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #app-loader.loader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      text-align: center;
    }

    .loader-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #4f46e5;
      /* indigo-600 */
      box-shadow: 0 8px 24px -8px rgba(79, 70, 229, 0.5);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .loader-mark svg {
      width: 24px;
      height: 24px;
      color: #ffffff;
    }

    .loader-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e2e8f0;
      /* slate-200 */
      border-top-color: #4f46e5;
      /* indigo-600 */
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .loader-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .loader-title {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      /* slate-800 */
    }

    .loader-subtitle {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: #64748b;
      /* slate-500 */
      min-height: 16px;
      transition: opacity 0.3s ease;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-mark {
        animation: none;
      }

      .loader-spinner {
        animation-duration: 1.4s;
      }
    }
  </style>
</head>

<body>
  <div id="app-loader">
    <div class="loader-content">
      <div class="loader-mark" aria-hidden="true">
        <!-- heroCloudArrowUp, matches brand mark used across the app -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M7 16a4 4 0 0 1-.88-7.9A5.5 5.5 0 0 1 16.5 6a4.5 4.5 0 0 1 .5 8.98" />
          <path d="M12 12v9" />
          <path d="m8 17 4-4 4 4" />
        </svg>
      </div>

      <div class="loader-spinner" role="status" aria-label="Loading"></div>

      <div class="loader-text">
        <p class="loader-title">Loading TeleStore…</p>
        <p class="loader-subtitle" id="loader-subtitle"></p>
      </div>
    </div>
  </div>

  <app-root></app-root>

  <script>
    (function () {
      var subtitle = document.getElementById('loader-subtitle');

      // Reassure the user if the bundle is taking unusually long to load.
      var slowTimer = setTimeout(function () {
        subtitle.textContent = "Still loading — this is taking longer than usual.";
      }, 6000);
    })();
  </script>
</body>

</html>
